name: XRV Intel B60 replay

on:
  workflow_dispatch:
    inputs:
      authorize_gpu:
        description: "I authorize synthetic QSA kernel replay on the isolated B60 XRV runner"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xrv-b60-gpu
  cancel-in-progress: false

jobs:
  qsa-kernels:
    if: ${{ inputs.authorize_gpu && vars.XRV_B60_ENABLED == 'true' && vars.XRV_GPU_RUNNER_ISOLATED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: xrv-b60
    runs-on: [self-hosted, linux, x64, intel-xpu, b60, xrv]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted revision and isolated idle runner
        env:
          XRV_GPU_RUNNER_ISOLATED: ${{ vars.XRV_GPU_RUNNER_ISOLATED }}
        run: |
          set -euo pipefail
          test "$XRV_GPU_RUNNER_ISOLATED" = true
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$GITHUB_REF_NAME"
          if pgrep -f '[x]enithium-server|[x]enithium-probe|[x]enithium-bake' >/dev/null; then
            echo "Refusing GPU run: Xenithium server/probe/bake process is active; no process was stopped." >&2
            exit 2
          fi
          command -v icpx
          command -v sycl-ls
          command -v xpu-smi
          sycl-ls
          xpu-smi discovery
      - name: Build QSA replay adapters
        run: |
          set -euo pipefail
          source scripts/oneapi-env.sh
          scripts/build-host.sh xenithium-xrv-qsa-select
          scripts/build-host.sh xenithium-xrv-qsa-sparse-attention
      - name: Replay fixtures under one host lock
        run: |
          set -euo pipefail
          source scripts/oneapi-env.sh
          flock -n /tmp/xrv-b60.lock bash -c '
            set -euo pipefail
            export XRV_WORKLOAD_ISOLATION=attested-idle-after-process-check-and-exclusive-lock
            scripts/xrv replay --fixture tests/data/xrv/qsa-select-synthetic --backend xpu --warmup 5 --repeat 30 --output "$RUNNER_TEMP/xrv-select"
            scripts/xrv replay --fixture tests/data/xrv/qsa-k8v4-sparse-synthetic --backend xpu --warmup 5 --repeat 30 --output "$RUNNER_TEMP/xrv-attention"
          '
          python3 - "$RUNNER_TEMP/xrv-select/result.json" "$RUNNER_TEMP/xrv-select/comparison.json" "$RUNNER_TEMP/xrv-attention/result.json" "$RUNNER_TEMP/xrv-attention/comparison.json" "$RUNNER_TEMP/xrv-b60-summary.json" <<'PY'
          import json,sys
          items=[]
          for result_path,comparison_path in ((sys.argv[1],sys.argv[2]),(sys.argv[3],sys.argv[4])):
              result=json.load(open(result_path,encoding="utf-8"))
              cmp=json.load(open(comparison_path,encoding="utf-8"))
              count=cmp.get("mismatch_count",cmp.get("bf16_bitwise_mismatch_count"))
              items.append({"mode":result["mode"],"fixture_id":result["fixture_id"],"manifest_sha256":result["fixture_manifest_sha256"],"kernel_id":result["kernel_id"],"correctness":cmp["status"],"mismatch_count":count,"timing":result["timing"],"hardware":result["hardware"],"runtime":result["runtime"],"tp":result["tp"],"gpu_validation":True,"performance_change_percent":None})
          json.dump({"tier":"intel-b60","fixtures":items},open(sys.argv[5],"w",encoding="utf-8"),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xrv-b60-summary
          path: ${{ runner.temp }}/xrv-b60-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove fixture outputs from runner temp
        if: always()
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          rm -rf -- "$RUNNER_TEMP/xrv-select" "$RUNNER_TEMP/xrv-attention" "$RUNNER_TEMP/xrv-b60-summary.json"
